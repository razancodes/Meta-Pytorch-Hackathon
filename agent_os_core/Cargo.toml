[package]
name = "agent_os_core"
version = "0.2.0"
edition = "2021"
description = "AgentOS-Kernel — Tokio-powered async tool execution runtime with HTTP dispatch"

[lib]
name = "agent_os_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
